name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}
      - uses: pnpm/setup@v3
        if: ${{ steps.release.outputs.release_created }}
        with:
          cache: true
      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created }}
        run: pnpm publish --provenance --access public
