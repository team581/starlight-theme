name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
      - parallel:
          - run: pnpm format
          - run: pnpm lint
          - run: pnpm knip
          - run: pnpm check
          - run: pnpm pack
