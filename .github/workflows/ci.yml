name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    name: Check package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm check
      - run: pnpm pack
