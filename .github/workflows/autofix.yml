name: autofix.ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  autofix:
    name: Autofix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
      - run: pnpm format:fix
        continue-on-error: true
      - run: pnpm lint:fix
        continue-on-error: true
      - uses: autofix-ci/action@v1
        with:
          commit-message: 'refactor: apply automatic fixes'
